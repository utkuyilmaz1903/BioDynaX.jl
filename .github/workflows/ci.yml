name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ["1.10", "1"]
        include:
          # Single macOS cell (Julia 1, not 1.10 and not recovery).
          - os: macos-latest
            julia-version: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: SciMLFormatter config and new-file check
        run: |
          test -f .JuliaFormatter.toml
          julia -e '
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(PackageSpec(name="JuliaFormatter", version="1"))
          using JuliaFormatter
          files = [
              "test/test_invariants.jl",
              "test/test_example_smoke.jl",
              "src/Precompile.jl",
              "src/UniqueClaim.jl",
              "test/test_unique_claim_product.jl",
              "test/test_protocol_fingerprint.jl",
              "src/CompilerContract.jl",
              "test/test_compiler_contract.jl",
              "test/test_protocol_surface.jl",
              "src/DataGenContract.jl",
              "src/RecoveryAdmission.jl",
              "test/test_datagen_contract.jl",
              "test/test_recovery_admission.jl",
              "src/DiscoveryWorkspace.jl",
              "src/TrainingReuse.jl",
              "src/RecoverySuiteSkip.jl",
              "src/ExperimentCheckpoint.jl",
              "src/FailureModes.jl",
              "src/HybridCompose.jl",
              "src/HybridResidual.jl",
              "src/IdentifiabilityProduct.jl",
              "src/GraphLocalLibrary.jl",
              "src/DenominatorDomain.jl",
              "src/ParameterSchemaPack.jl",
              "test/test_discovery_workspace.jl",
              "test/test_training_reuse.jl",
              "test/test_recovery_suite_skip.jl",
              "test/test_experiment_checkpoint.jl",
              "test/test_failure_modes.jl",
              "test/test_hybrid_compose.jl",
              "test/test_hybrid_residual.jl",
              "test/test_identifiability_product.jl",
              "test/test_graph_local_library.jl",
              "test/test_denominator_domain.jl",
              "test/test_parameter_schema_pack.jl",
              "test/quality.jl",
              "test/run_standards.jl",
              "test/test_standards.jl",
              "test/test_standards_jet.jl",
          ]
          ok = true
          for file in files
              format(file; overwrite=false) || (ok = false)
          end
          ok || error("JuliaFormatter would change a listed file; re-run format")
          '

  allocation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Allocation regression gate
        run: julia --project=. benchmark/allocation_gate.jl

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Benchmark smoke
        run: |
          julia --project=. -e 'using BioDynaX, Random; rng=MersenneTwister(0); net=BioDynaX.build_linear_test_network(); model,p=build_ude_model(rng,net); cache=allocate_cache(model,Float64); u=[0.2,0.1]; params=pack_parameters((k_ba=0.8,k_a=1.2,k_b=0.5), p.nn); for _ in 1:10; ude_rhs!(cache.du,u,params,0.0,model,cache); end; println(@allocated ude_rhs!(cache.du,u,params,0.0,model,cache))'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Static quality gates
        run: |
          julia -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(path=pwd()); Pkg.add(["Aqua", "JET"]); include("test/quality.jl")'

  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Industry-bar SciML standards
        run: |
          julia -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(path=pwd()); Pkg.add(["JET", "ForwardDiff"]); include("test/run_standards.jl")'

  docs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs docs/instantiate.jl
          julia --project=docs docs/make.jl

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Unknown-edge scientific recovery
        run: julia --project=. --color=yes test/run_recovery_hard.jl

  external-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Isolated DataDrivenSparse resolve probe
        run: julia --project=. benchmark/probe_datadriven.jl
        continue-on-error: true

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Validate Project.toml compat entries
        run: |
          julia -e '
          using Pkg
          using Test
          using TOML
          project = TOML.parsefile("Project.toml")
          compat = project["compat"]
          deps = merge(
              get(project, "deps", Dict{String,Any}()),
              get(project, "weakdeps", Dict{String,Any}()))
          stdlibs = Set(["Dates", "Distributed", "LinearAlgebra", "Random",
                         "Serialization", "SHA", "Statistics", "Test", "julia"])
          @testset "compat hygiene" begin
              for name in keys(deps)
                  @test haskey(compat, name)
              end
              for (name, bound) in compat
                  @test Pkg.Types.semver_spec(string(bound)) isa Pkg.Types.VersionSpec
                  name in stdlibs && continue
                  @test haskey(deps, name)
              end
          end'
