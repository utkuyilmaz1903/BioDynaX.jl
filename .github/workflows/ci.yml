name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly heavy tier: trained-model recovery protocol and the multi-minute
    # training-loop tests.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Julia ${{ matrix.julia-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.julia-version == '1' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1'
      - uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1'
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  format:
    name: Formatting (JuliaFormatter, SciML style)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Check that the tree is formatted
        run: |
          julia -e '
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(PackageSpec(name="JuliaFormatter", version="1"))
          using JuliaFormatter
          format(["src", "ext", "test", "examples", "benchmark", "docs"]; overwrite=false) ||
              error("JuliaFormatter would change a file; run format([\"src\", \"ext\", \"test\", \"examples\", \"benchmark\", \"docs\"])")
          '

  quality:
    name: Aqua and JET
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Aqua and JET checks
        run: |
          julia -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(path=pwd()); Pkg.add(["Aqua", "JET"]); include("test/quality.jl")'

  allocation-gate:
    name: Allocation check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: In-place right-hand side allocations
        run: julia --project=. benchmark/allocation_gate.jl

  compat:
    name: Project.toml compat entries
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Every dependency and weak dependency has a compat bound
        run: |
          julia -e '
          using Pkg
          using Test
          using TOML
          project = TOML.parsefile("Project.toml")
          compat = project["compat"]
          deps = merge(
              get(project, "deps", Dict{String,Any}()),
              get(project, "weakdeps", Dict{String,Any}()))
          stdlibs = Set(["Dates", "Distributed", "LinearAlgebra", "Random",
                         "Serialization", "SHA", "Statistics", "Test", "julia"])
          @testset "compat hygiene" begin
              for name in keys(deps)
                  @test haskey(compat, name)
              end
              for (name, bound) in compat
                  @test Pkg.Types.semver_spec(string(bound)) isa Pkg.Types.VersionSpec
                  name in stdlibs && continue
                  @test haskey(deps, name)
              end
          end'

  docs:
    name: Documentation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Build documentation (deploys from main and version tags)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs docs/instantiate.jl
          julia --project=docs docs/make.jl

  external-baseline:
    name: DataDrivenSparse resolve probe
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Isolated resolve probe (allowed to fail)
        run: julia --project=. benchmark/probe_datadriven.jl

  heavy:
    name: Heavy tier (recovery protocol, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Default suite plus the heavy tier
        env:
          BIODYNAX_TEST_HEAVY: "1"
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Trained-model recovery protocol
        run: julia --project=. --color=yes test/run_recovery_hard.jl
      - name: Trained-model library comparison
        run: julia --project=. --color=yes test/run_m4_b_protocol.jl
      - name: JET and SciML standards
        run: |
          julia -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop(path=pwd()); Pkg.add(["JET", "ForwardDiff"]); include("test/run_standards.jl")'
